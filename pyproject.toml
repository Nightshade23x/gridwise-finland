[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridwise-finland"
version = "0.1.0"
description = "Finland electricity demand forecasting and energy intelligence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1,<3",
  "numpy>=1.24,<3",
  "requests>=2.31,<3",
  "python-dotenv>=1.0,<2",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
ml = ["lightgbm>=4.4,<5", "scikit-learn>=1.5,<2"]
app = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gridwise = ["dashboard/*.html", "dashboard/*.css", "dashboard/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
