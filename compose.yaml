services:
  gridwise:
    build: .
    environment:
      GRIDWISE_PROJECT_ROOT: /app
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./data/model_outputs:/app/data/model_outputs:ro
      - ./data/live:/app/data/live:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5))['status'] == 'ready'"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

  refresh:
    profiles: ["refresh"]
    build: .
    env_file:
      - .env
    environment:
      GRIDWISE_PROJECT_ROOT: /app
    volumes:
      - ./data/live:/app/data/live
    command: ["python", "-m", "gridwise.refresh"]
    restart: "no"
